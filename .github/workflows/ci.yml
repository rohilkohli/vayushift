name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  firestore-contract:
    name: Storage contract on the Firestore emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator
      - run: npm ci
      - name: Start the Firestore emulator
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8080 > emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080 > /dev/null; then echo "emulator ready"; exit 0; fi
            sleep 1
          done
          cat emulator.log
          echo "emulator did not start"; exit 1
      - name: Run the storage contract against Firestore
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: npx vitest run src/server/adapters/storage.contract.test.ts

  container:
    name: Build and smoke-test the container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t vayushift:ci .
      - name: Run it and call the health endpoints
        run: |
          docker run -d --name vayushift -p 8080:8080 vayushift:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/api/healthz
          curl -sf http://127.0.0.1:8080/api/readyz
          docker logs vayushift
      - name: The bundled server must be able to load the Firestore client
        # Regression guard: in Next's production bundle the Firestore classes once failed to load
        # ("TypeError: a is not a constructor"), which unit tests under plain Node cannot see.
        run: |
          docker run -d --name vayushift-fs -p 8081:8080 \
            -e STORAGE_BACKEND=firestore -e GOOGLE_CLOUD_PROJECT=ci-demo -e FIRESTORE_EMULATOR_HOST=127.0.0.1:1 \
            vayushift:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/api/healthz > /dev/null; then break; fi
            sleep 1
          done
          # Nothing is listening on the emulator port, so readiness fails: what matters is HOW it fails.
          curl -s http://127.0.0.1:8081/api/readyz > /dev/null || true
          docker logs vayushift-fs > fs.log 2>&1
          cat fs.log
          if grep -q "is not a constructor" fs.log; then echo "Firestore client failed to load in the bundle"; exit 1; fi
          grep -q "readiness check failed" fs.log
      - name: A bad configuration must stop the container
        run: |
          set +e
          docker run --rm -e STORAGE_BACKEND=firestore vayushift:ci
          code=$?
          echo "exit code: $code"
          test "$code" -ne 0
